# starter plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# tmux navigator
set -g @plugin 'christoomey/vim-tmux-navigator'

# set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Use PowerShell for new panes
set-option -g default-shell /usr/local/bin/pwsh

# enable mouse mode
set -g mouse on

# start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Rose Pine Dawn
set -g status-style "bg=#faf4ed,fg=#575279"

# Windows — inactive
set -g window-status-format " #I:#W "
set -g window-status-style "bg=#faf4ed,fg=#9893a5"

# Windows — active, iris/lavender
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "bg=#907aa9,fg=#faf4ed,bold"

# Pane borders
set -g pane-border-style "fg=#f2e9e1"
set -g pane-active-border-style "fg=#907aa9"

# Status bar left — heart in lavender pill
set -g status-left "#[bg=#907aa9,fg=#faf4ed,bold] ♡ #[bg=#faf4ed,fg=#907aa9]\ue0b4 "
set -g status-left-length 40

# Status bar right — elegant 12hr time
set -g status-right "#[bg=#faf4ed,fg=#797593] %I:%M %p "
set -g status-right-length 20

# Status bar position
set -g status-position top

# Message style
set -g message-style "bg=#907aa9,fg=#faf4ed"

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
