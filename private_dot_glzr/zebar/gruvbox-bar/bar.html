<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <script
      src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
      integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect } from 'https://esm.sh/react@18?dev';
      import { createRoot } from 'https://esm.sh/react-dom@18/client?dev';
      import * as zebar from 'https://esm.sh/zebar@3.0';

      // Exeter, NH 03833
      const WEATHER_LATITUDE = 42.9814;
      const WEATHER_LONGITUDE = -70.9478;

      const providers = zebar.createProviderGroup({
        glazewm: { type: 'glazewm' },
        date: { type: 'date', formatting: 'EEE MMM d  h:mm a' },
        cpu: { type: 'cpu' },
        memory: { type: 'memory' },
        network: { type: 'network' },
        battery: { type: 'battery' },
        media: { type: 'media' },
        weather:
          WEATHER_LATITUDE !== null && WEATHER_LONGITUDE !== null
            ? { type: 'weather', latitude: WEATHER_LATITUDE, longitude: WEATHER_LONGITUDE }
            : { type: 'weather' },
      });

      createRoot(document.getElementById('root')).render(<App />);

      function App() {
        const [output, setOutput] = useState(providers.outputMap);

        useEffect(() => {
          providers.onOutput(() => setOutput(providers.outputMap));
        }, []);

        function networkIcon(net) {
          switch (net.defaultInterface?.type) {
            case 'ethernet': return <i className="nf nf-md-ethernet_cable"></i>;
            case 'proprietary_virtual': return <i className="nf nf-md-shield_lock_outline"></i>;
            case 'wifi': {
              const s = net.defaultGateway?.signalStrength ?? 0;
              if (s >= 80) return <i className="nf nf-md-wifi_strength_4"></i>;
              if (s >= 65) return <i className="nf nf-md-wifi_strength_3"></i>;
              if (s >= 40) return <i className="nf nf-md-wifi_strength_2"></i>;
              if (s >= 25) return <i className="nf nf-md-wifi_strength_1"></i>;
              return <i className="nf nf-md-wifi_strength_outline"></i>;
            }
            default: return <i className="nf nf-md-wifi_strength_off_outline"></i>;
          }
        }

        function batteryIcon(b) {
          if (b.chargePercent > 90) return <i className="nf nf-fa-battery_4"></i>;
          if (b.chargePercent > 70) return <i className="nf nf-fa-battery_3"></i>;
          if (b.chargePercent > 40) return <i className="nf nf-fa-battery_2"></i>;
          if (b.chargePercent > 20) return <i className="nf nf-fa-battery_1"></i>;
          return <i className="nf nf-fa-battery_0"></i>;
        }

        function weatherIcon(w) {
          switch (w.status) {
            case 'clear_day': return <i className="nf nf-weather-day_sunny"></i>;
            case 'clear_night': return <i className="nf nf-weather-night_clear"></i>;
            case 'cloudy_day': return <i className="nf nf-weather-day_cloudy"></i>;
            case 'cloudy_night': return <i className="nf nf-weather-night_alt_cloudy"></i>;
            case 'light_rain_day': return <i className="nf nf-weather-day_sprinkle"></i>;
            case 'light_rain_night': return <i className="nf nf-weather-night_alt_sprinkle"></i>;
            case 'heavy_rain_day': return <i className="nf nf-weather-day_rain"></i>;
            case 'heavy_rain_night': return <i className="nf nf-weather-night_alt_rain"></i>;
            case 'snow_day': return <i className="nf nf-weather-day_snow"></i>;
            case 'snow_night': return <i className="nf nf-weather-night_alt_snow"></i>;
            case 'thunder_day': return <i className="nf nf-weather-day_lightning"></i>;
            case 'thunder_night': return <i className="nf nf-weather-night_alt_lightning"></i>;
            default: return <i className="nf nf-weather-na"></i>;
          }
        }

        function mediaText(m) {
          const s = m.currentSession;
          if (!s || !s.title) return null;
          return s.artist ? `${s.artist} — ${s.title}` : s.title;
        }

        const nowPlaying = output.media ? mediaText(output.media) : null;

        return (
          <div className="app">
            <div className="left">
              <i className="logo nf nf-fa-coffee"></i>
              {output.glazewm && (
                <div className="workspaces">
                  {output.glazewm.currentWorkspaces.map(ws => (
                    <button
                      key={ws.name}
                      className={`workspace ${ws.hasFocus ? 'focused' : ''} ${ws.isDisplayed ? 'displayed' : ''}`}
                      onClick={() => output.glazewm.runCommand(`focus --workspace ${ws.name}`)}
                    >
                      {ws.displayName ?? ws.name}
                    </button>
                  ))}
                </div>
              )}
              {output.glazewm && (
                <>
                  <button
                    className={`tiling-direction nf ${
                      output.glazewm.tilingDirection === 'horizontal'
                        ? 'nf-md-swap_horizontal'
                        : 'nf-md-swap_vertical'
                    }`}
                    onClick={() => output.glazewm.runCommand('toggle-tiling-direction')}
                  ></button>
                  {output.glazewm.isPaused && (
                    <button
                      className="paused-button"
                      onClick={() => output.glazewm.runCommand('wm-toggle-pause')}
                    >PAUSED</button>
                  )}
                  {output.glazewm.bindingModes.map(m => (
                    <button
                      key={m.name}
                      className="binding-mode"
                      onClick={() => output.glazewm.runCommand(`wm-disable-binding-mode --name ${m.name}`)}
                    >{m.displayName ?? m.name}</button>
                  ))}
                </>
              )}
            </div>

            <div className="center">
              {nowPlaying && <div className="media">♪ {nowPlaying}</div>}
            </div>

            <div className="right">
              {output.weather && (
                <div className="weather">
                  {weatherIcon(output.weather)}
                  {Math.round(output.weather.fahrenheitTemp)}°F
                </div>
              )}
              {output.network && (
                <div className="network">
                  {networkIcon(output.network)}
                  {output.network.defaultGateway?.ssid ?? ''}
                </div>
              )}
              {output.cpu && (
                <div className="cpu">
                  <i className="nf nf-oct-cpu"></i>
                  <span className={output.cpu.usage > 85 ? 'high-usage' : ''}>
                    {Math.round(output.cpu.usage)}%
                  </span>
                </div>
              )}
              {output.memory && (
                <div className="memory">
                  <i className="nf nf-fae-chip"></i>
                  {Math.round(output.memory.usage)}%
                </div>
              )}
              {output.battery && (
                <div className="battery">
                  {output.battery.isCharging && (
                    <i className="nf nf-md-power_plug charging-icon"></i>
                  )}
                  {batteryIcon(output.battery)}
                  {Math.round(output.battery.chargePercent)}%
                </div>
              )}
              {output.date && <div className="clock">{output.date.formatted}</div>}
            </div>
          </div>
        );
      }
    </script>
  </body>
</html>
